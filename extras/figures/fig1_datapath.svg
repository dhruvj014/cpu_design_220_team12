<rect x='580' y='348' width='200' height='26' rx='5' fill='#f7f9fd' stroke='#335' stroke-width='1.6'/>
<text x='680.0' y='365.0' font-size='12' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>R5  scratch</text>
<rect x='580' y='374' width='200' height='26' rx='5' fill='#f7f9fd' stroke='#335' stroke-width='1.6'/>
<text x='680.0' y='391.0' font-size='12' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>R6  FP (software)</text>
<rect x='580' y='400' width='200' height='26' rx='5' fill='#f7f9fd' stroke='#335' stroke-width='1.6'/>
