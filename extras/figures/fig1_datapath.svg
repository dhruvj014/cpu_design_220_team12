<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='790' viewBox='0 0 1200 790'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='1200' height='790' fill='white'/><text x='600' y='22' font-size='17' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>SJ16 datapath: 16-bit CPU, 8 registers, 256-byte memory</text>
<rect x='30' y='60' width='210' height='36' rx='5' fill='#dfe8f5' stroke='#335' stroke-width='1.6'/>
<text x='135.0' y='82.33333333333333' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>MEMORY  256 bytes</text>
<rect x='30' y='96' width='210' height='210' rx='5' fill='#eaf3ea' stroke='#335' stroke-width='1.6'/>
<text x='135.0' y='196.33333333333334' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>CODE  0x00-0x2F</text>
<text x='135.0' y='214.33333333333334' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>24 instructions</text>
<rect x='30' y='306' width='210' height='54' rx='5' fill='#fdf1dc' stroke='#335' stroke-width='1.6'/>
<text x='135.0' y='328.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>DATA  0x30-0x37</text>
<text x='135.0' y='346.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>variables, result</text>
<rect x='30' y='360' width='210' height='54' rx='5' fill='#fdf1dc' stroke='#335' stroke-width='1.6'/>
<text x='135.0' y='382.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>TAG  0x38-0x3F</text>
<text x='135.0' y='400.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>ASCII text</text>
<rect x='30' y='414' width='210' height='290' rx='5' fill='#f3e8f5' stroke='#335' stroke-width='1.6'/>
<text x='135.0' y='545.3333333333334' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>STACK  0x40-0xFF</text>
<text x='135.0' y='563.3333333333334' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>grows down from 0x100</text>
<text x='135.0' y='581.3333333333334' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>(not printed in trace)</text>
<rect x='24' y='96' width='222' height='318' rx='5' fill='none' stroke='#c33' stroke-width='1.6' stroke-dasharray='6 4'/>
<text x='135' y='735' font-size='12' text-anchor='middle' fill='#c33' font-family='Arial, Helvetica, sans-serif'>red dashed = trace window 0x00-0x3F</text>
<text x='135' y='752' font-size='12' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>big-endian words, even addresses only</text>
<rect x='300' y='60' width='110' height='40' rx='5' fill='#dfe8f5' stroke='#335' stroke-width='1.6'/>
<text x='355.0' y='84.33333333333333' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>PC</text>
<rect x='300' y='150' width='110' height='40' rx='5' fill='#dfe8f5' stroke='#335' stroke-width='1.6'/>
<text x='355.0' y='174.33333333333334' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>IR  16 bits</text>
<rect x='300' y='230' width='200' height='100' rx='5' fill='#eef3fb' stroke='#335' stroke-width='1.6'/>
<text x='400.0' y='257.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>DECODE</text>
<text x='400.0' y='275.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>op = ir[15:12]  rd = ir[11:9]</text>
<text x='400.0' y='293.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>rs1 = ir[8:6]  rs2 = ir[5:3]</text>
<text x='400.0' y='311.3333333333333' font-size='13' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>imm6 = ir[5:0]  imm9 = ir[8:0]</text>
