<text x='560.0' y='722.0' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>CHECKS  (a fault changes nothing)</text>
<text x='560.0' y='739.0' font-size='12' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>PC even and inside code; reserved bits 0; jump / call / return target inside code</text>
<text x='560.0' y='756.0' font-size='12' text-anchor='middle' fill='#111' font-family='Arial, Helvetica, sans-serif'>ST only into data, heap or live stack;  every write to R7: odd, &gt; top, &lt; limit</text></svg>
